name: classbari
description: "ClassBARI phone apps: Student, Guardian, Teacher, Institution and AI Chat"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  http: ^1.6.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/gen/
    - assets/icons/
  # English letters: Plus Jakarta Sans (one file, every weight). Bangla and the ৳ sign: Hind Siliguri, as on the website.
  # Both from github.com/google/fonts (SIL Open Font Licence; each file carries its own licence note).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
